<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e20">
<meta name="description" content="STUDY BURST TCG — 勉強でパックを開ける本格カードバトル">
<title>STUDY BURST TCG — 知識をカードに変えろ</title>
<link rel="stylesheet" href="./style.css">
<script src="./cards.js" defer></script><script src="./script.js" defer></script>
</head>
<body>
<div class="ambient ambient-1"></div><div class="ambient ambient-2"></div>
<div class="app" id="app">
<header class="masthead">
  <button class="brand" data-go="home" aria-label="ホーム"><span class="brand-emblem">✦</span><span class="brand-text"><strong>STUDY<span>BURST</span></strong><small>TRADING CARD GAME</small></span></button>
  <div class="top-resources"><div class="resource"><span>PACK</span><b id="topPacks">0</b></div><div class="resource"><span>SHARDS</span><b id="topShards">0</b></div><div class="avatar">S</div></div>
</header>
<main id="screen" tabindex="-1"></main>
<nav class="dock" aria-label="メニュー">
  <button data-go="home" class="active"><span>⌂</span><small>HOME</small></button>
  <button data-go="study"><span>✎</span><small>STUDY</small></button>
  <button data-go="packs"><span>✦</span><small>PACK</small></button>
  <button data-go="deck"><span>▱</span><small>DECK</small></button>
  <button data-go="duel"><span>⚔</span><small>DUEL</small></button>
  <button data-go="codex"><span>▦</span><small>CARDS</small></button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>
</div>
</body></html>
